<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タイマー付き汎用メモ</title>
  <style>
    body { 
      font-family: sans-serif; 
      padding: 10px; 
      background-color: #f4f4f4; 
      margin: 0;
    }
    
    /* 1行タイマー枠（スマホ等でもつぶれず折り返すレスポンシブ配置） */
    .timer-container {
      display: flex;
      flex-wrap: wrap; /* 画面幅が狭い場合は綺麗に折り返す */
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #fff;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 12px;
    }
    .timer-display { 
      font-size: 1.3rem; 
      font-weight: bold; 
      min-width: 95px; 
      text-align: center; 
      padding: 2px 4px;
    }
    .timer-inputs {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    /* スマホでもつぶれずアップダウンキーが出る幅・サイズ設定 */
    .num-input { 
      width: 48px; 
      height: 32px;
      padding: 2px 4px; 
      font-size: 16px; /* スマホの自動ズーム防止 */
      text-align: center; 
      border: 1px solid #ccc; 
      border-radius: 4px; 
      box-sizing: border-box;
    }
    .timer-buttons {
      display: flex;
      gap: 4px;
    }
    .t-btn { 
      height: 32px;
      padding: 0 10px; 
      font-weight: bold; 
      font-size: 14px;
      cursor: pointer; 
      border: none; 
      border-radius: 4px; 
    }
    .btn-start { background: #28a745; color: white; }
    .btn-stop { background: #dc3545; color: white; }
    .btn-reset { background: #6c757d; color: white; }

    /* メモエリア */
    .memo-row { 
      display: flex; 
      align-items: center;
      gap: 8px; /* 入力欄同士の基本余白 */
      margin-bottom: 8px; 
    }
    /* 日付・ID用入力欄（全角6文字／半角12文字対応＋右余白） */
    .id-input { 
      width: 125px; /* 全角6文字分がしっかり入る幅 */
      height: 34px;
      padding: 4px 6px; 
      border: 1px solid #ccc; 
      border-radius: 4px; 
      text-align: center; 
      font-size: 15px;
      margin-right: 4px; /* 右側に「＋余白」を追加 */
      box-sizing: border-box;
    }
    /* メモ用入力欄 */
    .text-input { 
      flex-grow: 1; 
      height: 34px;
      padding: 4px 8px; 
      border: 1px solid #ccc; 
      border-radius: 4px; 
      font-size: 15px;
      box-sizing: border-box;
    }
    .save-btn { 
      width: 100%; 
      height: 40px;
      font-size: 16px;
      font-weight: bold; 
      cursor: pointer; 
      background: #007bff; 
      color: white; 
      border: none; 
      border-radius: 4px; 
      margin-bottom: 12px; 
    }
  </style>
</head>
<body>

  <!-- タイマーエリア -->
  <div class="timer-container">
    <div id="display" class="timer-display">00:00:00</div>
    <div class="timer-inputs">
      <input type="number" id="hInput" class="num-input" placeholder="時" min="0" max="99">時
      <input type="number" id="mInput" class="num-input" placeholder="分" min="0" max="59">分
      <input type="number" id="sInput" class="num-input" placeholder="秒" min="0" max="59">秒
    </div>
    <div class="timer-buttons">
      <button class="t-btn btn-start" onclick="startTimer()">スタート</button>
      <button class="t-btn btn-stop" onclick="stopTimer()">ストップ</button>
      <button class="t-btn btn-reset" onclick="resetTimer()">リセット</button>
    </div>
  </div>

  <button class="save-btn" onclick="saveAllMemos()">すべて保存</button>

  <!-- 10個のメモ枠 -->
  <div id="memoContainer"></div>

  <script>
    /* タイマー処理 */
    let timerId = null;
    let totalSeconds = 0;

    function updateDisplay() {
      const h = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
      const m = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
      const s = String(totalSeconds % 60).padStart(2, '0');
      document.getElementById('display').textContent = `${h}:${m}:${s}`;
    }

    function startTimer() {
      if (timerId !== null) return;

      const h = parseInt(document.getElementById('hInput').value) || 0;
      const m = parseInt(document.getElementById('mInput').value) || 0;
      const s = parseInt(document.getElementById('sInput').value) || 0;

      if (totalSeconds === 0) {
        totalSeconds = h * 3600 + m * 60 + s;
      }

      if (totalSeconds <= 0) return;

      updateDisplay();
      timerId = setInterval(() => {
        totalSeconds--;
        updateDisplay();
        if (totalSeconds <= 0) {
          clearInterval(timerId);
          timerId = null;
          alert('時間になりました！');
        }
      }, 1000);
    }

    function stopTimer() {
      if (timerId !== null) {
        clearInterval(timerId);
        timerId = null;
      }
    }

    function resetTimer() {
      stopTimer();
      totalSeconds = 0;
      document.getElementById('hInput').value = '';
      document.getElementById('mInput').value = '';
      document.getElementById('sInput').value = '';
      updateDisplay();
    }

    /* メモ処理（10行分） */
    const TOTAL_MEMOS = 10;

    window.onload = function() {
      const container = document.getElementById('memoContainer');
      const savedData = JSON.parse(localStorage.getItem('my_10_memos')) || [];

      for (let i = 0; i < TOTAL_MEMOS; i++) {
        const row = document.createElement('div');
        row.className = 'memo-row';
        
        // 日付・コード入力欄（半角12文字／全角6文字対応・初期表示は完全空白）
        const idInput = document.createElement('input');
        idInput.type = 'text';
        idInput.className = 'id-input';
        idInput.placeholder = '080913';
        idInput.maxLength = 12; // 最大12文字制限
        idInput.id = `id_${i}`;
        idInput.value = savedData[i] ? savedData[i].id : ''; // 保存データがない場合は空白

        // メモ入力欄
        const textInput = document.createElement('input');
        textInput.type = 'text';
        textInput.className = 'text-input';
        textInput.placeholder = 'メモ内容...';
        textInput.id = `text_${i}`;
        textInput.value = savedData[i] ? savedData[i].text : '';

        row.appendChild(idInput);
        row.appendChild(textInput);
        container.appendChild(row);
      }
    };

    function saveAllMemos() {
      const memoList = [];
      for (let i = 0; i < TOTAL_MEMOS; i++) {
        const idVal = document.getElementById(`id_${i}`).value;
        const textVal = document.getElementById(`text_${i}`).value;
        memoList.push({ id: idVal, text: textVal });
      }
      
      localStorage.setItem('my_10_memos', JSON.stringify(memoList));
      alert('保存しました！');
    }
  </script>

</body>
</html>
