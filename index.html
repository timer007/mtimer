<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タイマー付き汎用メモ (20行)</title>
  <style>
    body { 
      font-family: sans-serif; 
      padding: 10px; 
      background-color: #f4f4f4; 
      margin: 0;
    }
    
    /* 1行タイマー枠 */
    .timer-container {
      display: flex;
      flex-wrap: wrap; 
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #fff;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .timer-display { 
      font-size: 1.3rem; 
      font-weight: bold; 
      min-width: 95px; 
      text-align: center; 
      padding: 2px 4px;
    }
    .timer-inputs {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .num-input { 
      width: 48px; 
      height: 32px;
      padding: 2px 4px; 
      font-size: 16px; 
      text-align: center; 
      border: 1px solid #ccc; 
      border-radius: 4px; 
      box-sizing: border-box;
    }
    .timer-buttons {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    .t-btn { 
      height: 32px;
      padding: 0 8px; 
      font-weight: bold; 
      font-size: 13px;
      cursor: pointer; 
      border: none; 
      border-radius: 4px; 
    }
    .btn-start { background: #28a745; color: white; }
    .btn-stop { background: #dc3545; color: white; }
    .btn-reset { background: #6c757d; color: white; }
    .btn-preset { background: #17a2b8; color: white; }
    .btn-sound { background: #ffc107; color: #333; }

    /* 一括操作エリア（保存・コピペ共通ボタン） */
    .global-controls {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .save-btn { 
      flex-grow: 2; 
      height: 40px;
      font-size: 16px;
      font-weight: bold; 
      cursor: pointer; 
      background: #007bff; 
      color: white; 
      border: none; 
      border-radius: 4px; 
    }
    .clip-btn {
      flex-grow: 1;
      height: 40px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      background: #6c757d;
      color: white;
      border: none;
      border-radius: 4px;
    }

    /* メモエリア */
    .memo-row { 
      display: flex; 
      align-items: center;
      gap: 8px; 
      margin-bottom: 8px; 
    }
    .id-input { 
      width: 125px; 
      height: 34px;
      padding: 4px 6px; 
      border: 1px solid #ccc; 
      border-radius: 4px; 
      text-align: center; 
      font-size: 14px;
      box-sizing: border-box;
    }
    .text-input { 
      flex-grow: 1; 
      height: 34px;
      padding: 4px 8px; 
      border: 1px solid #ccc; 
      border-radius: 4px; 
      font-size: 14px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <!-- タイマーエリア -->
  <div class="timer-container">
    <div id="display" class="timer-display">00:00:00</div>
    <div class="timer-inputs">
      <input type="number" id="hInput" class="num-input" placeholder="時" min="0" max="99">時
      <input type="number" id="mInput" class="num-input" placeholder="分" min="0" max="59">分
      <input type="number" id="sInput" class="num-input" placeholder="秒" min="0" max="59">秒
    </div>
    <div class="timer-buttons">
      <button class="t-btn btn-start" onclick="startTimer()">スタート</button>
      <button class="t-btn btn-stop" onclick="stopTimer()">ストップ</button>
      <button class="t-btn btn-reset" onclick="resetTimer()">リセット</button>
      
      <!-- プリセットボタン -->
      <button class="t-btn btn-preset" onclick="setPreset(3)">3分</button>
      <button class="t-btn btn-preset" onclick="setPreset(5)">5分</button>
      <button class="t-btn btn-preset" onclick="setPreset(10)">10分</button>
      
      <!-- 音ON/OFF -->
      <button id="soundBtn" class="t-btn btn-sound" onclick="toggleSound()">音 OFF</button>
    </div>
  </div>

  <!-- 上部共通コントロールボタン -->
  <div class="global-controls">
    <button class="save-btn" onclick="saveAllMemos()">すべて保存</button>
    <button class="clip-btn" onclick="copyActiveCell()">コピー</button>
    <button class="clip-btn" onclick="pasteActiveCell()">ペースト</button>
  </div>

  <!-- 20個のメモ枠 -->
  <div id="memoContainer"></div>

  <script>
    /* アクティブな入力枠を追跡する処理 */
    let lastActiveInput = null;

    document.addEventListener('focusin', (e) => {
      if (e.target.tagName === 'INPUT' && (e.target.classList.contains('id-input') || e.target.classList.contains('text-input'))) {
        lastActiveInput = e.target;
      }
    });

    /* アクティブセルのコピー機能 */
    function copyActiveCell() {
      if (!lastActiveInput) {
        alert('コピーしたい入力欄（ID欄またはメモ欄）をクリックして選択してください。');
        return;
      }
      const textToCopy = lastActiveInput.value;
      if (!textToCopy) {
        alert('選択されている欄は空です。');
        return;
      }

      navigator.clipboard.writeText(textToCopy).then(() => {
        alert('コピーしました！');
      }).catch(() => {
        alert('コピーに失敗しました。');
      });
    }

    /* アクティブセルのペースト機能 */
    function pasteActiveCell() {
      if (!lastActiveInput) {
        alert('貼り付けたい入力欄（ID欄またはメモ欄）をクリックして選択してください。');
        return;
      }

      navigator.clipboard.readText().then(text => {
        lastActiveInput.value = text;
      }).catch(() => {
        alert('ペースト権限がないか失敗しました。');
      });
    }

    /* タイマー処理（バックグラウンド対応） */
    let timerId = null;
    let endTime = null;
    let remainingSeconds = 0;
    let isSoundOn = false;

    function updateDisplay(totalSec) {
      const h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
      const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
      const s = String(totalSec % 60).padStart(2, '0');
      document.getElementById('display').textContent = `${h}:${m}:${s}`;
    }

    function startTimer() {
      if (timerId !== null) return;

      if (remainingSeconds === 0) {
        const h = parseInt(document.getElementById('hInput').value) || 0;
        const m = parseInt(document.getElementById('mInput').value) || 0;
        const s = parseInt(document.getElementById('sInput').value) || 0;
        remainingSeconds = h * 3600 + m * 60 + s;
      }

      if (remainingSeconds <= 0) return;

      endTime = Date.now() + remainingSeconds * 1000;
      updateDisplay(remainingSeconds);

      timerId = setInterval(() => {
        const now = Date.now();
        const diff = Math.ceil((endTime - now) / 1000);

        if (diff <= 0) {
          clearInterval(timerId);
          timerId = null;
          remainingSeconds = 0;
          updateDisplay(0);
          playAlarm();
          alert('時間になりました！');
        } else {
          remainingSeconds = diff;
          updateDisplay(remainingSeconds);
        }
      }, 500);
    }

    function stopTimer() {
      if (timerId !== null) {
        clearInterval(timerId);
        timerId = null;
      }
    }

    function resetTimer() {
      stopTimer();
      remainingSeconds = 0;
      document.getElementById('hInput').value = '';
      document.getElementById('mInput').value = '';
      document.getElementById('sInput').value = '';
      updateDisplay(0);
    }

    /* プリセットタイマー設定 */
    function setPreset(minutes) {
      resetTimer();
      document.getElementById('mInput').value = minutes;
      startTimer();
    }

    /* アラーム音切替 */
    function toggleSound() {
      isSoundOn = !isSoundOn;
      const btn = document.getElementById('soundBtn');
      btn.textContent = isSoundOn ? '音 ON' : '音 OFF';
    }

    function playAlarm() {
      if (!isSoundOn) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 1.5);
      } catch(e) {}
    }

    /* メモ処理（20行分） */
    const TOTAL_MEMOS = 20;

    window.onload = function() {
      const container = document.getElementById('memoContainer');
      const savedData = JSON.parse(localStorage.getItem('my_20_memos')) || [];

      for (let i = 0; i < TOTAL_MEMOS; i++) {
        const row = document.createElement('div');
        row.className = 'memo-row';
        
        // ID/日付入力欄
        const idInput = document.createElement('input');
        idInput.type = 'text';
        idInput.className = 'id-input';
        idInput.placeholder = '';
        idInput.maxLength = 12;
        idInput.id = `id_${i}`;
        idInput.value = savedData[i] ? savedData[i].id : '';

        // メモ入力欄
        const textInput = document.createElement('input');
        textInput.type = 'text';
        textInput.className = 'text-input';
        textInput.placeholder = '';
        textInput.id = `text_${i}`;
        textInput.value = savedData[i] ? savedData[i].text : '';

        row.appendChild(idInput);
        row.appendChild(textInput);
        container.appendChild(row);
      }
    };

    function saveAllMemos() {
      const memoList = [];
      for (let i = 0; i < TOTAL_MEMOS; i++) {
        const idVal = document.getElementById(`id_${i}`).value;
        const textVal = document.getElementById(`text_${i}`).value;
        memoList.push({ id: idVal, text: textVal });
      }
      
      localStorage.setItem('my_20_memos', JSON.stringify(memoList));
      alert('保存しました！');
    }
  </script>

</body>
</html>
